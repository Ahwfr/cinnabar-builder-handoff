[package]
name = "schematica-builder"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
schematica-core = { path = "../core" }
anyhow = "1"
nucleation = { version = "=0.12.0", default-features = false }
wit-component = "=0.247.0"
wasm-encoder = "=0.247.0"
wasmparser = "=0.247.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
